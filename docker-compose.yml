services:
  postgres:
    image: postgres:16-alpine
    container_name: doc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docadmin_secret_change_me}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docadmin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - doc-approval-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: doc-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-docmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-docmq_secret_change_me}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - doc-approval-net
    restart: unless-stopped

  document-api:
    build:
      context: .
      dockerfile: src/Document.Api/Dockerfile
    container_name: doc-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DocumentDb: Host=postgres;Port=5432;Database=${DOCUMENT_DB_NAME:-document_db};Username=${POSTGRES_USER:-docadmin};Password=${POSTGRES_PASSWORD:-docadmin_secret_change_me}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-docmq}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-docmq_secret_change_me}
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
    ports:
      - "${DOCUMENT_API_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - doc-approval-net
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: src/Notification.Service/Dockerfile
    container_name: doc-notification
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5002
      ConnectionStrings__NotificationDb: Host=postgres;Port=5432;Database=${NOTIFICATION_DB_NAME:-notification_db};Username=${POSTGRES_USER:-docadmin};Password=${POSTGRES_PASSWORD:-docadmin_secret_change_me}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-docmq}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-docmq_secret_change_me}
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-5002}:5002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - doc-approval-net
    restart: unless-stopped

  web-client:
    build:
      context: .
      dockerfile: src/Approval.WebClient/Dockerfile
    container_name: doc-web-client
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      Services__DocumentApiUrl: http://document-api:5001
      Services__NotificationServiceUrl: http://notification-service:5002
      Services__PublicNotificationHubUrl: ${PUBLIC_NOTIFICATION_HUB_URL:-http://localhost:5002/hubs/notifications}
      Services__PublicDocumentApiUrl: ${PUBLIC_DOCUMENT_API_URL:-http://localhost:5001}
    ports:
      - "${WEB_CLIENT_PORT:-5000}:5000"
    depends_on:
      document-api:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - doc-approval-net
    restart: unless-stopped

networks:
  doc-approval-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
